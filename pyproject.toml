[project]
name = "argus"
version = "0.0.0"
description = "Fully automated 0DTE SPX credit spread execution system"
license = "Apache-2.0"
requires-python = ">=3.12"
# The broker-facing layer (session/auth, DXLink market data) uses the tastytrade
# SDK. Everything else remains stdlib (sqlite3, tomllib, asyncio, hashlib).
dependencies = [
    "tastytrade>=13.2,<14",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Regenerates the hash-pinned runtime lock the Docker image builds from.
    # Dev-only — never reaches the image, which installs requirements.txt.
    "pip-tools>=7.4",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the numbered migration SQL alongside the package.
"argus.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
